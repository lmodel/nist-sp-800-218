# Task PO.1.3, which SP 800-218 notes was PW.3.1 before version 1.1, with
# two of its examples and three of its references. The descriptions
# paraphrase SP 800-218; the mapped items are those it lists.
task_id: PO.1.3
former_task_ids:
  - PW.3.1
description: >-
  Tell every third party that supplies commercial software components for
  reuse what security requirements those components must meet.
implementation_examples:
  - example_id: PO.1.3.1
    description: >-
      Put a core set of security requirements for components into
      acquisition documents, contracts and other agreements.
  - example_id: PO.1.3.2
    description: >-
      Define security criteria for choosing software, such as the third
      party's vulnerability disclosure program.
task_references:
  - reference_document: BSAFSS
    mapped_items: SM.1, SM.2, SM.2-1, SM.2-4
  - reference_document: EO14028
    mapped_items: 4e(vi), 4e(ix)
  - reference_document: SP80053
    mapped_items: SA-4, SA-9, SA-10, SA-10(1), SA-15, SR-3, SR-4, SR-5
