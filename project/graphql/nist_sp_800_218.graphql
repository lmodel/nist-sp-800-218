type SsdfFramework
  {
    ssdfVersion: String!
    practiceGroups: [SsdfPracticeGroup]!
  }

type SsdfImplementationExample
  {
    description: String!
    exampleId: SsdfExampleIdentifier!
  }

type SsdfPractice
  {
    title: String
    description: String
    practiceId: SsdfPracticeIdentifier!
    practiceTasks: [SsdfTask]
  }

type SsdfPracticeGroup
  {
    title: String
    description: String
    groupId: SsdfGroupIdentifier!
    groupPractices: [SsdfPractice]
  }

type SsdfReference
  {
    referenceDocument: SsdfReferenceDocument!
    mappedItems: String!
  }

type SsdfTask
  {
    description: String
    taskId: SsdfTaskIdentifier!
    formerTaskIds: [SsdfTaskIdentifier]
    implementationExamples: [SsdfImplementationExample]
    taskReferences: [SsdfReference]
  }
